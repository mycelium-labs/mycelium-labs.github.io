name: Deploy sandbox to Azure

on:
  push:
    branches: [main]
    paths:
      - "sandbox/**"
      - ".github/workflows/deploy-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires repo secrets (see sandbox/DEPLOY.md):
    #   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
    #   ACR_NAME, RESOURCE_GROUP, CONTAINER_APP_NAME
    if: ${{ vars.AZURE_SANDBOX_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr build \
            -r "${{ secrets.ACR_NAME }}" \
            -t mycelium-sandbox:${{ github.sha }} \
            -t mycelium-sandbox:latest \
            -g "${{ secrets.RESOURCE_GROUP }}" \
            ./sandbox

      - name: Update Container App
        run: |
          az containerapp update \
            -n "${{ secrets.CONTAINER_APP_NAME }}" \
            -g "${{ secrets.RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/mycelium-sandbox:${{ github.sha }}"
