<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starting sandbox · Mycelium</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0e0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=3">
  <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml">
  <style>
    :root {
      --bg: #0a0e0b;
      --ink: #ede9de;
      --muted: #91a294;
      --brand: #6be59b;
      --track: #141b15;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: min(26rem, 100%);
    }
    .brand {
      margin: 0 0 1.5rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--brand);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .sub {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .bar {
      height: 4px;
      background: var(--track);
      border: 1px solid rgba(238, 240, 226, 0.14);
      overflow: hidden;
      margin: 0 0 0.85rem;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--brand);
      transition: width 0.35s linear;
    }
    .bar.is-ready > i { width: 100%; }
    .bar.is-long > i {
      width: 92%;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar > i { transition: none; }
      .bar.is-long > i { animation: none; opacity: 0.85; }
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0 0 1.5rem;
      font-variant-numeric: tabular-nums;
    }
    .status { color: var(--ink); }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1.25rem;
      font-size: 0.9rem;
    }
    .links a {
      color: var(--brand);
      text-decoration: none;
      border-bottom: 1px solid rgba(216, 196, 90, 0.45);
    }
    .links a:hover { border-bottom-color: var(--brand); }
    .error { color: #e0b0a0; }
  </style>
</head>
<body>
  <svg class="sentinel sentinel--sandbox" viewBox="0 0 150 210" aria-hidden="true" focusable="false">
    <path class="sentinel-stem" d="M74 202C73 169 74 132 77 98M76 139C61 123 50 109 39 89M77 112C91 94 103 76 112 54"/>
    <path class="sentinel-leaf" d="M39 89C29 84 23 77 24 68L37 73L27 60L42 66L35 50L49 59L45 42L55 32C65 40 69 50 65 60L58 52L61 68L51 60L52 77L43 68Z"/>
    <path class="sentinel-leaf" d="M112 54C101 53 93 47 91 39L105 42L93 31L108 36L99 21L114 30L111 14L119 4C131 10 137 20 134 31L126 23L130 39L119 32L122 48L112 40Z"/>
    <path class="sentinel-leaf" d="M76 139C66 138 58 132 57 124L68 127L59 117L71 122L65 109L76 117L74 103L81 96C91 102 95 111 92 120L85 114L88 127L79 121L81 134L74 128Z"/>
    <path class="monstera-rib" d="M39 89L55 49M55 49L33 48M51 59L68 53M47 68L27 64M112 54L113 22M113 29L99 23M113 37L128 29M108 44L96 40M76 139L70 108M70 116L58 112M72 124L82 116"/>
    <path class="sentinel-ground" d="M44 203C59 198 89 198 105 203"/>
  </svg>
  <div class="card">
    <p class="brand">Mycelium</p>
    <h1 id="title">Starting sandbox</h1>
    <p class="sub" id="sub">
      If the demo was idle, Azure may need 10–30 seconds to wake the container.
      This page waits until it’s ready.
    </p>
    <div class="bar" id="bar" aria-hidden="true"><i id="fill"></i></div>
    <div class="meta">
      <span class="status" id="status">Checking…</span>
      <span id="elapsed">0s</span>
    </div>
    <div class="links">
      <a id="open" href="#">Open anyway</a>
      <a href="/">Back to handbook</a>
    </div>
  </div>
  <script>
    (function () {
      var TARGET = "https://myceliumsbx.mangobay-2157ee12.southindia.azurecontainerapps.io/";
      var HEALTH = TARGET.replace(/\/?$/, "/") + "api/health";
      var EXPECTED_MS = 25000;
      var started = Date.now();
      var done = false;

      var title = document.getElementById("title");
      var sub = document.getElementById("sub");
      var status = document.getElementById("status");
      var elapsed = document.getElementById("elapsed");
      var bar = document.getElementById("bar");
      var fill = document.getElementById("fill");
      var open = document.getElementById("open");

      open.href = TARGET;

      function tick() {
        if (done) return;
        var ms = Date.now() - started;
        var sec = Math.floor(ms / 1000);
        elapsed.textContent = sec + "s";
        var pct = Math.min(90, (ms / EXPECTED_MS) * 90);
        fill.style.width = pct + "%";
        if (ms >= EXPECTED_MS) bar.classList.add("is-long");
      }

      function ready() {
        if (done) return;
        done = true;
        bar.classList.remove("is-long");
        bar.classList.add("is-ready");
        fill.style.width = "100%";
        title.textContent = "Sandbox ready";
        sub.textContent = "Opening the interactive demo…";
        status.textContent = "Ready";
        elapsed.textContent = Math.floor((Date.now() - started) / 1000) + "s";
        window.setTimeout(function () {
          window.location.replace(TARGET);
        }, 350);
      }

      function fail(msg) {
        status.innerHTML = '<span class="error">' + msg + "</span>";
      }

      async function probe() {
        if (done) return;
        status.textContent = "Waking container…";
        try {
          var ctrl = new AbortController();
          var t = window.setTimeout(function () { ctrl.abort(); }, 8000);
          var res = await fetch(HEALTH, {
            method: "GET",
            cache: "no-store",
            signal: ctrl.signal,
          });
          window.clearTimeout(t);
          if (res.ok) {
            ready();
            return;
          }
          status.textContent = "Still starting…";
        } catch (err) {
          status.textContent = "Still starting…";
        }
      }

      tick();
      window.setInterval(tick, 250);
      probe();
      window.setInterval(probe, 1500);

      window.setTimeout(function () {
        if (!done) {
          fail("Still waking after 60s — try Open anyway.");
        }
      }, 60000);
    })();
  </script>
</body>
</html>
